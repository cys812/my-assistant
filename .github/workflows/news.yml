name: 뉴스 수집

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: RSS 수집
        run: node scripts/fetch-news.mjs
      - name: 바뀐 경우에만 저장
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || (git commit -m "뉴스 갱신 $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
